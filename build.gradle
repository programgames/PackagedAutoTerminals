buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 2.3 est la dernière lignée qui gère Minecraft 1.12.2.
        // Version publiée et épinglée, plutôt que 2.3-SNAPSHOT, pour un build reproductible.
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3.10'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'idea'

group = 'fr.julien.packagedautoterminals'
archivesBaseName = 'packagedautoterminals'
version = "${mcVersion}-${modVersion}"

sourceCompatibility = 1.8
targetCompatibility = 1.8

// Sans cela, Gradle compile avec l'encodage par défaut de la plateforme (windows-1252 ici),
// ce qui transforme tout caractère accentué des sources en mojibake.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// PIÈGE : dans le bloc `minecraft { }`, le délégué Groovy est l'extension ForgeGradle, qui
// possède ses PROPRES propriétés `mcVersion` et `forgeVersion`. Les résoudre ici, dehors.
def targetMinecraft = "${project.mcVersion}-${project.forgeVersion}".toString()
def targetMappings = project.mcpMappings.toString()

minecraft {
    version = targetMinecraft
    runDir = 'run'
    mappings = targetMappings

    // Injecte la version dans Reference.VERSION au build. Elle ne vit que dans
    // gradle.properties.
    replace '@MOD_VERSION@', project.version.toString()
}

repositories {
    // Dépôt Maven LOCAL, pas un `flatDir`.
    //
    // PIÈGE : avec `flatDir`, ForgeGradle saute ses tâches de déobfuscation
    // (`deobfProvidedDeobfDepTask0 SKIPPED`). On compile alors contre les noms SRG
    // d'AE2 (`func_146976_a`), et tout héritage d'une classe AE2 échoue sur
    // « is not abstract and does not override abstract method ».
    // Un vrai dépôt Maven fait de ces jars des modules, et le remappage s'exécute.
    //
    // Motif du dépôt local : aucun Maven officiel ne publie AE2UEL (voir docs/PLAN.md, lot 0).
    maven {
        name = 'LocalLibs'
        url = uri("${projectDir}/libs/maven")
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

dependencies {
    // `deobfProvided` : nécessaire à la compilation, jamais embarqué dans notre jar.
    // ForgeGradle remappe ces jars publiés (noms SRG) vers les noms MCP du poste de dev.
    deobfProvided "pat:ae2-uel:${project.ae2uelVersion}@jar"
    deobfProvided "pat:packagedauto:${project.packagedAutoVersion}@jar"
    // JEI, via HadEnoughItems : même API `mezz.jei.api`, même modid `jei`.
    deobfProvided "pat:hadenoughitems:${project.jeiVersion}@jar"
}

// PIÈGE, suite. ForgeGradle ajoute bien les jars déobfusqués au chemin de compilation, mais
// il y laisse AUSSI les jars bruts, et les bruts passent en premier. javac prend donc la
// première correspondance, donc les noms SRG, et tout héritage d'une classe AE2 échoue.
// On retire ici les artefacts bruts du dépôt local. Les versions déobfusquées restent.
afterEvaluate {
    sourceSets.main.compileClasspath = sourceSets.main.compileClasspath.filter { file ->
        !file.absolutePath.startsWith(new File(projectDir, 'libs/maven').absolutePath)
    }
}

// En environnement de dev, FML construit le pack de ressources du mod à partir du dossier
// où il a trouvé la classe du mod, donc `build/classes/java/main`. Gradle 4 écrit les
// ressources ailleurs, dans `build/resources/main`. Les fichiers de langue et les textures
// deviennent alors invisibles, sans la moindre erreur dans le journal.
// On remet donc les ressources à côté des classes.
sourceSets.main.output.resourcesDir = file("${buildDir}/classes/java/main")

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    // Conséquence du `resourcesDir` ci-dessus : classes et ressources partagent un dossier,
    // que Gradle ajoute deux fois. Sans cette ligne, `reobfJar` échoue sur
    // « duplicate entry: assets/.../en_us.lang ».
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            'Specification-Title'     : 'packagedautoterminals',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Le pseudo de développement est aléatoire par défaut (`Player640`, `Player123`, ...).
// Un pseudo fixe garde les sessions de test comparables d'un lancement à l'autre.
afterEvaluate {
    tasks.matching { it.name == 'runClient' }.all {
        args '--username', 'PAT_Dev'
    }

    // En dev, FML charge le mod depuis le JAR de `build/libs`, et non depuis les classes :
    // le journal affiche « Source du mod : …\build\libs\packagedautoterminals-….jar ».
    // Sans cette dépendance, `runClient` peut donc lancer du CODE PÉRIMÉ, sans rien signaler.
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.all {
        dependsOn 'reobfJar'
        dependsOn 'checkDevMods'
    }
}

// Garde-fou : ForgeGradle 2.3 et Gradle 4.x ne tournent que sous JDK 8. Échouer ici avec un
// message clair vaut mieux qu'une trace illisible au milieu de setupDecompWorkspace.
def javaVersion = System.getProperty('java.version')
if (!javaVersion.startsWith('1.8')) {
    throw new GradleException(
        "JDK 8 requis pour ForgeGradle 2.3, mais Gradle tourne sous Java ${javaVersion}.\n" +
        "  Corrigez JAVA_HOME, par exemple :\n" +
        "    \$env:JAVA_HOME = 'C:/Program Files/Eclipse Adoptium/jdk-8.0.472.8-hotspot'"
    )
}

// Garde-fou : les deux fichiers de langue doivent porter exactement les mêmes clés.
// Minecraft retombe en anglais pour une clé absente, sans rien signaler. Une divergence
// passerait donc inaperçue jusqu'à ce qu'un joueur la voie.
task checkLang {
    description = 'Echoue si en_us.lang et fr_fr.lang divergent.'
    group = 'verification'

    def langDir = file('src/main/resources/assets/packagedautoterminals/lang')
    inputs.files fileTree(dir: langDir, include: '*.lang')

    doLast {
        def parse = { File file ->
            def entries = [:]
            file.getText('UTF-8').readLines().eachWithIndex { line, index ->
                def trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                def separator = line.indexOf('=')
                if (separator < 0) {
                    throw new GradleException("${file.name}:${index + 1} ligne sans '=' : ${trimmed}")
                }
                entries[line.substring(0, separator).trim()] = line.substring(separator + 1)
            }
            return entries
        }

        def reference = parse(new File(langDir, 'en_us.lang'))
        def problems = []

        fileTree(dir: langDir, include: '*.lang').sort { it.name }.each { File file ->
            if (file.name == 'en_us.lang') {
                return
            }
            def entries = parse(file)
            (reference.keySet() - entries.keySet()).each {
                problems << "${file.name} : clé absente, ${it}"
            }
            (entries.keySet() - reference.keySet()).each {
                problems << "${file.name} : clé inconnue d'en_us.lang, ${it}"
            }
            entries.each { key, value ->
                if (reference.containsKey(key)) {
                    def expected = reference[key].count('%s') + reference[key].count('%d')
                    def found = value.count('%s') + value.count('%d')
                    if (expected != found) {
                        problems << "${file.name} : ${key} porte ${found} paramètres, contre ${expected} dans en_us.lang"
                    }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Les traductions divergent :' + System.lineSeparator()
                    + problems.collect { "  ${it}" }.join(System.lineSeparator()))
        }
        logger.lifecycle("Traductions : ${reference.size()} clés, en accord.")
    }
}

check.dependsOn checkLang

// Garde-fou : un jar présent dans `libs/maven` ne doit JAMAIS se retrouver dans `run/mods`.
// ForgeGradle met les dépendances sur le chemin d'exécution, FML les charge comme des mods,
// et le doublon arrête le jeu sur `DuplicateModsFoundException`. Ce piège est tombé deux
// fois : avec AE2UEL, puis avec JEI. Il s'arrête ici.
task checkDevMods {
    description = 'Echoue si un jar de libs/maven est aussi dans run/mods.'
    group = 'verification'

    doLast {
        def runMods = file('run/mods')
        if (!runMods.exists()) {
            return
        }

        def normalise = { String name -> name.toLowerCase().replaceAll('[^a-z0-9]', '') }
        def problems = []

        fileTree(dir: 'libs/maven', include: '**/*.jar').files.each { jar ->
            def artifact = normalise(jar.parentFile.parentFile.name)
            runMods.listFiles({ file -> file.name.endsWith('.jar') } as FileFilter).each { mod ->
                if (normalise(mod.name).contains(artifact)) {
                    problems << "  run/mods/${mod.name} fait doublon avec la dépendance ${jar.parentFile.parentFile.name}"
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                    'Des mods sont présents deux fois. FML refusera de démarrer.'
                    + System.lineSeparator() + problems.join(System.lineSeparator())
                    + System.lineSeparator()
                    + '  Supprime ces fichiers de run/mods : la dépendance suffit.')
        }
    }
}

task printCp {
    doLast { sourceSets.main.compileClasspath.each { println "CP: " + it } }
}

task printRcp {
    doLast { sourceSets.main.runtimeClasspath.findAll { it.path.contains("PackagedAutoTerminals") }.each { println "RCP: " + it } }
}
