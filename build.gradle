buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 2.3 is the last line that supports Minecraft 1.12.2.
        // A published, pinned version rather than 2.3-SNAPSHOT, for a reproducible build.
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3.10'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'idea'

group = 'fr.julien.packagedautoterminals'
archivesBaseName = 'packagedautoterminals'
version = "${mcVersion}-${modVersion}"

sourceCompatibility = 1.8
targetCompatibility = 1.8

// Without this, Gradle compiles with the platform default encoding (windows-1252 here),
// which turns every accented character in the sources into mojibake.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'

    // PITFALL: the MixinBooter jar carries the Mixin annotation processor, which javac
    // discovers on its own through `META-INF/services`. That processor requires every target
    // class to be on the compile path, and stops on
    // "Mixin target ... could not be found".
    //
    // Our mixins target AE2WUT **by name**, not by class, so we do not drag MekEng, AE2FC and
    // ae2exttable onto the compile path (rule 7). The processor is therefore useless here:
    // its only other job is to write a remapping table, which our injections do without,
    // since no Minecraft type appears in the target signatures.
    //
    // If a mixin ever touches a Minecraft method, this line must go, the processor must be
    // added, and the table must be declared in the configuration file.
    options.compilerArgs << '-proc:none'
}

// PITFALL: inside the `minecraft { }` block, the Groovy delegate is the ForgeGradle
// extension, which has its OWN `mcVersion` and `forgeVersion` properties. Resolve them here,
// outside.
def targetMinecraft = "${project.mcVersion}-${project.forgeVersion}".toString()
def targetMappings = project.mcpMappings.toString()

minecraft {
    version = targetMinecraft
    runDir = 'run'
    mappings = targetMappings

    // Injects the version into Reference.VERSION at build time. It lives only in
    // gradle.properties.
    replace '@MOD_VERSION@', project.version.toString()
}

repositories {
    // LOCAL Maven repository, not a `flatDir`.
    //
    // PITFALL: with `flatDir`, ForgeGradle skips its deobfuscation tasks
    // (`deobfProvidedDeobfDepTask0 SKIPPED`). We then compile against the AE2 SRG names
    // (`func_146976_a`), and every class that extends an AE2 class fails with
    // "is not abstract and does not override abstract method".
    // A real Maven repository turns those jars into modules, and the remapping runs.
    //
    // Why a local repository: no official Maven publishes AE2UEL (see docs/PLAN.md, batch 0).
    maven {
        name = 'LocalLibs'
        url = uri("${projectDir}/libs/maven")
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

dependencies {
    // `deobfProvided`: required to compile, never bundled into our jar.
    // ForgeGradle remaps these published jars (SRG names) to the MCP names of the workspace.
    deobfProvided "pat:ae2-uel:${project.ae2uelVersion}@jar"
    deobfProvided "pat:packagedauto:${project.packagedAutoVersion}@jar"
    // JEI, through HadEnoughItems: same `mezz.jei.api` API, same `jei` modid.
    deobfProvided "pat:hadenoughitems:${project.jeiVersion}@jar"

    // MixinBooter carries the Mixin library. `compileOnly`, and outside `libs/maven`, for
    // two reasons: ForgeGradle does not put `compileOnly` entries on the runtime path, so
    // there is no duplicate with `run/mods/mixinbooter-10.7.jar`; and the `checkDevMods` task
    // only walks `libs/maven`.
    compileOnly files('libs/mixinbooter-10.7.jar')
}

// PITFALL, continued. ForgeGradle does add the deobfuscated jars to the compile path, but it
// ALSO leaves the raw jars there, and the raw ones come first. javac therefore takes the
// first match, hence the SRG names, and every class that extends an AE2 class fails.
// We remove the raw artifacts of the local repository here. The deobfuscated ones stay.
afterEvaluate {
    sourceSets.main.compileClasspath = sourceSets.main.compileClasspath.filter { file ->
        !file.absolutePath.startsWith(new File(projectDir, 'libs/maven').absolutePath)
    }
}

// In a development workspace, FML builds the mod resource pack from the folder where it
// found the mod class, hence `build/classes/java/main`. Gradle 4 writes the resources
// elsewhere, into `build/resources/main`. The language files and the textures then become
// invisible, with no error at all in the log.
// So we put the resources back next to the classes.
sourceSets.main.output.resourcesDir = file("${buildDir}/classes/java/main")

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    // Consequence of the `resourcesDir` above: classes and resources share a folder, which
    // Gradle adds twice. Without this line, `reobfJar` fails with
    // "duplicate entry: assets/.../en_us.lang".
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            'Specification-Title'     : 'packagedautoterminals',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// The development user name is random by default (`Player640`, `Player123`, ...).
// A fixed name keeps test sessions comparable from one run to the next.
afterEvaluate {
    tasks.matching { it.name == 'runClient' }.all {
        args '--username', 'PAT_Dev'
    }

    // In dev, FML loads the mod from the JAR in `build/libs`, not from the classes: the log
    // shows "Mod source: ...\build\libs\packagedautoterminals-....jar".
    // Without this dependency, `runClient` can therefore run STALE CODE, without a word.
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.all {
        dependsOn 'reobfJar'
        dependsOn 'checkDevMods'
    }
}

// Guard rail: ForgeGradle 2.3 and Gradle 4.x only run on JDK 8. Failing here with a clear
// message beats an unreadable stack trace in the middle of setupDecompWorkspace.
def javaVersion = System.getProperty('java.version')
if (!javaVersion.startsWith('1.8')) {
    throw new GradleException(
        "JDK 8 is required for ForgeGradle 2.3, but Gradle runs on Java ${javaVersion}.\n" +
        "  Fix JAVA_HOME, for example:\n" +
        "    \$env:JAVA_HOME = 'C:/Program Files/Eclipse Adoptium/jdk-8.0.472.8-hotspot'"
    )
}

// Guard rail: both language files must carry exactly the same keys.
// Minecraft falls back to English for a missing key, without a word. A divergence would
// therefore go unnoticed until a player saw it.
task checkLang {
    description = 'Fails when en_us.lang and fr_fr.lang diverge.'
    group = 'verification'

    def langDir = file('src/main/resources/assets/packagedautoterminals/lang')
    inputs.files fileTree(dir: langDir, include: '*.lang')

    doLast {
        def parse = { File file ->
            def entries = [:]
            file.getText('UTF-8').readLines().eachWithIndex { line, index ->
                def trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                def separator = line.indexOf('=')
                if (separator < 0) {
                    throw new GradleException("${file.name}:${index + 1} line without '=': ${trimmed}")
                }
                entries[line.substring(0, separator).trim()] = line.substring(separator + 1)
            }
            return entries
        }

        def reference = parse(new File(langDir, 'en_us.lang'))
        def problems = []

        fileTree(dir: langDir, include: '*.lang').sort { it.name }.each { File file ->
            if (file.name == 'en_us.lang') {
                return
            }
            def entries = parse(file)
            (reference.keySet() - entries.keySet()).each {
                problems << "${file.name}: missing key, ${it}"
            }
            (entries.keySet() - reference.keySet()).each {
                problems << "${file.name}: key unknown to en_us.lang, ${it}"
            }
            entries.each { key, value ->
                if (reference.containsKey(key)) {
                    def expected = reference[key].count('%s') + reference[key].count('%d')
                    def found = value.count('%s') + value.count('%d')
                    if (expected != found) {
                        problems << "${file.name}: ${key} carries ${found} arguments, against ${expected} in en_us.lang"
                    }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException('The translations diverge:' + System.lineSeparator()
                    + problems.collect { "  ${it}" }.join(System.lineSeparator()))
        }
        logger.lifecycle("Translations: ${reference.size()} keys, in agreement.")
    }
}

check.dependsOn checkLang

// Guard rail: a jar present in `libs/maven` must NEVER end up in `run/mods`.
// ForgeGradle puts the dependencies on the runtime path, FML loads them as mods, and the
// duplicate stops the game with `DuplicateModsFoundException`. This trap was hit twice: with
// AE2UEL, then with JEI. It stops here.
task checkDevMods {
    description = 'Fails when a jar from libs/maven is also in run/mods.'
    group = 'verification'

    doLast {
        def runMods = file('run/mods')
        if (!runMods.exists()) {
            return
        }

        def normalise = { String name -> name.toLowerCase().replaceAll('[^a-z0-9]', '') }
        def problems = []

        fileTree(dir: 'libs/maven', include: '**/*.jar').files.each { jar ->
            def artifact = normalise(jar.parentFile.parentFile.name)
            runMods.listFiles({ file -> file.name.endsWith('.jar') } as FileFilter).each { mod ->
                if (normalise(mod.name).contains(artifact)) {
                    problems << "  run/mods/${mod.name} duplicates the dependency ${jar.parentFile.parentFile.name}"
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                    'Some mods are present twice. FML will refuse to start.'
                    + System.lineSeparator() + problems.join(System.lineSeparator())
                    + System.lineSeparator()
                    + '  Delete these files from run/mods: the dependency is enough.')
        }
    }
}

task printCp {
    doLast { sourceSets.main.compileClasspath.each { println "CP: " + it } }
}

task printRcp {
    doLast { sourceSets.main.runtimeClasspath.findAll { it.path.contains("PackagedAutoTerminals") }.each { println "RCP: " + it } }
}
