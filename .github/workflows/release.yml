# Publishes a release to CurseForge.
#
# The build does not happen here. libs/maven holds the dependency jars, and those jars are
# not versioned: they belong to their authors. GitHub therefore cannot compile the mod.
# You build the jar on your machine with tools/release.sh, which creates the GitHub release
# and attaches the jar. This workflow starts when that release is published, takes the jar
# back from it, and sends it to CurseForge.
#
# Two secrets are needed, under Settings > Secrets and variables > Actions:
#   CURSEFORGE_TOKEN       an API token from https://legacy.curseforge.com/account/api-tokens
#   CURSEFORGE_PROJECT_ID  the numeric id shown on the right of the project page
# Without them the job stops with a message, and the GitHub release stays valid.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to send, for example v0.1.0-beta.8"
        required: true

jobs:
  curseforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are present
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "::error::CURSEFORGE_TOKEN or CURSEFORGE_PROJECT_ID is missing. Upload the jar by hand this time."
            exit 1
          fi

      - name: Download the jar of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir dist
          # The sources jar must not reach CurseForge as the main file.
          rm -f dist/*-sources.jar
          ls -l dist

      - name: Read the release type from the version
        id: kind
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          case "$TAG" in
            *alpha*) echo "type=alpha" >> "$GITHUB_OUTPUT" ;;
            *beta*|*rc*) echo "type=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Find the jar
        id: jar
        run: echo "path=$(ls dist/*.jar | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: ${{ steps.jar.outputs.path }}
          release_type: ${{ steps.kind.outputs.type }}
          game_versions: "1.12.2,Java 8,Forge"
          changelog_type: markdown
          changelog: ${{ github.event.release.body || 'See the CHANGELOG of the repository.' }}
