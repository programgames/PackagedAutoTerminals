name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.3 and Gradle 4.10.3 only accept JDK 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # The dependencies live in libs/maven, which is not versioned: the jars belong to
      # their authors. Without them, the build cannot complete.
      - name: Check that the dependencies are present
        run: |
          if [ ! -f libs/maven/pat/ae2-uel/*/ae2-uel-*.jar ]; then
            echo "::warning::libs/maven is empty, the build will be skipped."
            exit 0
          fi

      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
