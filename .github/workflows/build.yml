name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The full history gives tools/check-changelog.sh origin/main and its merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A change to src/main needs a CHANGELOG line
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: bash tools/check-changelog.sh

      # ForgeGradle 2.3 and Gradle 4.10.3 only accept JDK 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - run: chmod +x gradlew

      # `build` compiles the mod, runs the unit tests, and runs checkLang, which compares
      # the sixteen language files against en_us.lang.
      #
      # The dependency jars live in libs/maven and are versioned, so this build needs no
      # download beyond Gradle itself.
      - run: ./gradlew build --no-daemon

      # Starts a dedicated server, then stops it. A client class reached on the server side
      # would stop the start. Here run/mods is empty, so only the libs/maven mods load: the
      # optional integrations must stay out of the way.
      - run: bash tools/server-smoke.sh
        timeout-minutes: 10

      - name: Keep the test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
