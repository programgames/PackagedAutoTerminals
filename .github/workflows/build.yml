name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 2.3 et Gradle 4.10.3 n'acceptent que le JDK 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # Les dépendances vivent dans libs/maven, qui n'est pas versionné : les jars
      # appartiennent à leurs auteurs. Sans eux, la compilation ne peut pas aboutir.
      - name: Vérifier la présence des dépendances
        run: |
          if [ ! -f libs/maven/pat/ae2-uel/*/ae2-uel-*.jar ]; then
            echo "::warning::libs/maven est vide, la compilation sera ignorée."
            exit 0
          fi

      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
